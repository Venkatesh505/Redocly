{
  "openapi": "3.0.1",
  "info": {
    "title": "Consent Capture Service",
    "description": "This service provides the functionality to subscribe the brand and it sub-brands from OneTrust and subscribe them to Marketo.",
        "x-metadata":{
           "capability": "EXPERIENCE API",
           "tags":["active", "experience"]
  },
    "license": {
      "name": "Apache 2.0",
      "url": "https://www.apache.org/licenses/LICENSE-2.0"
    },
    "version": "1.0"
  },  
  "servers": [
    {
      "url": "http://consent-capture-v1-app-p.aws-k8s.abbvienet.com",
      "description": "Generated server url"
    }
  ],
  "tags": [
    {
      "name": "API handles the subscription for brands.",
      "description": "Consent Capture Controller"
    }
  ],
  "paths": {
    "/api/v1/consentcapture/unSubscribe": {
      "post": {
        "tags": [
          "API handles the subscription for brands."
        ],
        "summary": "UnSubscribe the Brand",
        "description": "Please refer to the 'Example Value' and 'Schema' tabs under the 'Request body' section below. The provided sample example request demonstrates the neccessary details required to obtain a successful response. Ensure that all required fields are accurately filled in.",
        "operationId": "saveUnSubscribe",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UnSubscribeRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "500": {
            "description": "Internal server error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UnSubscribeResponse"
                },
                "example": {
                  "status": "ERROR",
                  "statusCode": 500,
                  "results": null,
                  "errors": [
                    {
                      "errorId": "SERVER_ERROR",
                      "errorCode": "10001",
                      "errorMessage": "Server Error"
                    }
                  ]
                }
              }
            }
          },
          "200": {
            "$ref": "#/components/responses/UnSubscribeSuccessResponse"
          },
          "400": {
            "$ref": "#/components/responses/BadRequestResponse"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenResponse"
          },
          "404": {
            "$ref": "#/components/responses/ResourceNotFoundResponse"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedResponse"
          }
        }
      }
    },
    "/api/v1/consentcapture/subscribeForMarketo": {
      "post": {
        "tags": [
          "API handles the subscription for brands."
        ],
        "summary": "Subscribe the Brand with Marketo",
        "description": "Please refer to the 'Example Value' and 'Schema' tabs under the 'Request body' section below. The provided sample example request demonstrates the neccessary details required to obtain a successful response. Ensure that all required fields are accurately filled in.",
        "operationId": "saveSubscribeForMarketo",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubscribeMarketoRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "500": {
            "$ref": "#/components/responses/InternalServerErrorResp"
          },
          "400": {
            "description": "Bad Request-Invalid or missing parameter",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubscribeResponse"
                },
                "example": "{\"status\": \"ERROR\", \"statusCode\": 400, \"results\": null, \"errors\": [{\"errorId\": \"BAD_REQUEST\", \"errorCode\": \"10006\", \"errorMessage\": \"Brand cannot be empty or null.\"}]}"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ResourceNotFoundResp"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenResp"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedResp"
          },
          "200": {
            "$ref": "#/components/responses/SubscribeAndMarketoSuccessResponse"
          }
        }
      }
    },
    "/api/v1/consentcapture/subscribe": {
      "post": {
        "tags": [
          "API handles the subscription for brands."
        ],
        "summary": "Subscribe the Brand",
        "description": "Please refer to the 'Example Value' and 'Schema' tabs under the 'Request body' section below. The provided sample example request demonstrates the neccessary details required to obtain a successful response. Ensure that all required fields are accurately filled in.",
        "operationId": "saveSubscribe",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubscribeRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "500": {
            "$ref": "#/components/responses/InternalServerErrorResp"
          },
          "400": {
            "description": "Bad Request-Invalid or missing parameter",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubscribeResponse"
                },
                "example": "{\"status\": \"ERROR\", \"statusCode\": 400, \"results\": null, \"errors\": [{\"errorId\": \"BAD_REQUEST\", \"errorCode\": \"10006\", \"errorMessage\": \"Brand cannot be empty or null.\"}]}"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/ResourceNotFoundResp"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenResp"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedResp"
          },
          "200": {
            "$ref": "#/components/responses/SubscribeAndMarketoSuccessResponse"
          }
        }
      }
    },
    "/api/v1/consentcapture/getExposureDetails": {
      "get": {
        "tags": [
          "API handles the subscription for brands."
        ],
        "summary": "Get Exposure Details",
        "description": "Please make sure to provide the 'exposureId' to receive a successful response.",
        "operationId": "getExposureDetails",
        "parameters": [
          {
            "name": "exposureId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "example": "EXP-02526"
          }
        ],
        "responses": {
          "500": {
            "$ref": "#/components/responses/InternalServerErrorResponse"
          },
          "200": {
            "$ref": "#/components/responses/UnSubscribeSuccessResponse"
          },
          "403": {
            "$ref": "#/components/responses/ForbiddenResponse"
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequestResponse"
          },
          "404": {
            "$ref": "#/components/responses/ResourceNotFoundResponse"
          },
          "401": {
            "$ref": "#/components/responses/UnauthorizedResponse"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "ErrorDto": {
        "type": "object",
        "properties": {
          "errorId": {
            "type": "string",
            "enum": [
              "BAD_REQUEST",
              "DATABASE_CONNECTION_ERROR",
              "NO_RECORD_FOUND",
              "SERVER_ERROR",
              "CLIENT_ERROR",
              "TRIGGER_EMAIL_CLIENT_ERROR"
            ]
          },
          "errorCode": {
            "type": "string"
          },
          "errorMessage": {
            "type": "string"
          }
        }
      },
      "ResponseData": {
        "type": "object",
        "properties": {
          "transactionType": {
            "type": "string"
          },
          "exposureId": {
            "type": "string"
          },
          "therapeuticArea": {
            "type": "string"
          },
          "communicationType": {
            "type": "string"
          },
          "preferenceCenterPageUrl": {
            "type": "string"
          },
          "displayVerbiage": {
            "type": "string"
          },
          "brandDetails": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BrandDetail"
            }
          }
        }
      },
      "UnSubscribeResponse": {
