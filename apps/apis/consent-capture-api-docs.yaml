          "communicationType": {
            "type": "string",
            "example": "COMM"
          },
          "hcpDetails": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "example": "personal@gmail.com"
              },
              "acid": {
                "type": "string",
                "example": "2122990126"
              },
              "npi": {
                "type": "string",
                "example": ""
