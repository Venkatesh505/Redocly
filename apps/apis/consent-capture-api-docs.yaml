              "npi": {
                "type": "string",
                "example": "npi12321"
              },
              "firstName": {
                "type": "string",
                "example": "FName12"
              },
              "lastName": {
                "type": "string",
                "example": "LName12"
              },
              "phoneNo": {
                "type": "string",
                "example": ""
              }
            }
          },
          "origin": {
            "type": "string",
            "example": "AEM"
          },
          "source": {
            "type": "string",
            "example": "Test"
