        "type": "object",
        "properties": {
          "userToken": {
            "type": "string",
            "example": "token123"
          },
          "exposureId": {
            "type": "string",
            "example": "EXP-02526"
          },
          "acid": {
            "type": "string",
            "example": "Acid111"
          },
          "email": {
            "type": "string",
            "example": "userBA13@abbvie.com"
          },
          "source": {
            "type": "string",
            "example": "Test Unsubcribe"
          }
        }
      },
      "SubscribeRequest": {
        "type": "object",
        "properties": {
          "exposureId": {
            "type": "string",
            "example": "EXP-02526"
          },
          "campaignId": {
            "type": "string",
            "example": "CMP-12345"
          },
          "brand": {
            "type": "string",
