  "host": "jumpstart-registration-v1-app-p.aws-k8s.abbvienet.com",
  "basePath": "/",
  "tags": [
    {
      "name": "Jump Start Registration",
      "description": "Jump Start Registration Controller"
    }
  ],
  "paths": {
    "/api/v1/user/register/iicsSubscribeOnetrust": {
      "get": {
        "tags": [
          "Jump Start Registration"
        ],
        "summary": "Subscribe Jump Start Data",
        "operationId": "iicsSubscribeOnetrustUsingGET",
        "produces": [
          "application/json"
        ],
        "parameters": [
          {
            "name": "acid",
            "in": "query",
            "description": "acid",
            "required": false,
            "type": "string"
          },
          {
            "name": "jumpStartId",
            "in": "query",
            "description": "jumpStartId",
            "required": true,
            "type": "string"
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "schema": {
              "$ref": "#/definitions/JumpStartRegistrationResponse"
            }
          },
          "400": {
            "description": "Invalid or missing parameter"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not Found"
          },
          "500": {
            "description": "Internal server error"
          }
        },
        "deprecated": false
      }
    },
    "/api/v1/user/register/jumpstart": {
      "post": {
        "tags": [
          "Jump Start Registration"
        ],
        "summary": "Jump Start",
        "operationId": "jumpStartRegistrationUsingPOST",
        "consumes": [
          "application/json"
        ],
        "produces": [
          "application/json"
        ],
        "parameters": [
          {
            "in": "body",
            "name": "jumpStartRegistrationRequest",
            "description": "jumpStartRegistrationRequest",
            "required": true,
            "schema": {
              "$ref": "#/definitions/JumpStartRegistrationRequest"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "schema": {
              "$ref": "#/definitions/JumpStartRegistrationResponse"
            }
          },
          "201": {
            "description": "Created"
          },
          "400": {
            "description": "Invalid or missing parameter"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not Found"
          },
          "500": {
            "description": "Internal server error"
          }
        },
        "deprecated": false
      }
    }
  },
