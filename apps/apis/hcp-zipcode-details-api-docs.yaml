{
  "swagger": "2.0",
  "info": {
    "title": "Hcp Zip Code Details",
    "description": "This service fetches the zipcode details corresponding to the HCP.",
        "x-metadata":{
           "capability": "SYSTEM API",
           "tags":["active", "core"]
  },
    "license": {
      "name": "Apache 2.0",
      "url": "https://www.apache.org/licenses/LICENSE-2.0"
    },
    "version": "1.0"
  },
  "host": "hcp-zipcode-validation-v1-app-p.aws-k8s.abbvienet.com",
  "basePath": "/",
  "tags": [
    {
      "name": "To get Postal Code Informations",
      "description": "Zipcode Controller"
    }
  ],
  "paths": {
    "/api/v1/hcp/zipcode": {
      "post": {
        "tags": [
          "To get Postal Code Informations"
        ],
        "summary": "To get Postal Code Informations",
        "operationId": "getPostalInformationUsingPOST",
        "consumes": [
          "application/json"
        ],
        "produces": [
          "*/*"
        ],
        "parameters": [
          {
            "in": "body",
            "name": "zipcoderequest",
            "description": "zipcoderequest",
            "required": true,
            "schema": {
              "$ref": "#/definitions/ZipcodeRequest"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "schema": {
              "$ref": "#/definitions/ZipcodeResponse"
            }
          },
          "201": {
            "description": "Created"
          },
          "400": {
            "description": "Invalid or missing parameter"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not Found"
          },
          "500": {
            "description": "Internal server error"
          }
        },
        "deprecated": false
      }
    },
    "/api/v1/hcp/zipcode/coordinates/{zipcode}": {
      "get": {
        "tags": [
          "To get Postal Code Informations"
        ],
        "summary": "To get Latitude and Longitude Informations",
        "operationId": "getLatLngInformationUsingGET",
        "produces": [
          "*/*"
        ],
        "parameters": [
          {
            "name": "zipcode",
            "in": "path",
            "description": "zipcode",
            "required": true,
            "type": "string"
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "schema": {
              "$ref": "#/definitions/CoordinateResponse"
            }
          },
          "400": {
            "description": "Invalid or missing parameter"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not Found"
          },
          "500": {
            "description": "Internal server error"
          }
        },
        "deprecated": false
      }
    },
    "/api/v1/hcp/zipcode/distance": {
      "post": {
        "tags": [
          "To get Postal Code Informations"
        ],
        "summary": "To list of zipcodes with the distance",
        "operationId": "getZipcodesWithDistUsingPOST",
        "consumes": [
          "application/json"
        ],
        "produces": [
          "*/*"
        ],
        "parameters": [
          {
            "in": "body",
            "name": "zipcodedistancerequest",
            "description": "zipcodedistancerequest",
            "required": true,
            "schema": {
              "$ref": "#/definitions/ZipcodeDistanceRequest"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "schema": {
              "type": "array",
              "items": {
                "$ref": "#/definitions/ZipcodeDistanceResponse"
              }
            }
          },
          "201": {
            "description": "Created"
          },
          "400": {
            "description": "Invalid or missing parameter"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not Found"
          },
          "500": {
            "description": "Internal server error"
          }
        },
        "deprecated": false
      }
    }
  },
  "definitions": {
    "CoordinateResponse": {
      "type": "object",
      "properties": {
        "latitude": {
          "type": "string"
        },
        "longitude": {
          "type": "string"
        }
      },
      "title": "CoordinateResponse"
    },
    "ZipcodeDistanceRequest": {
      "type": "object",
      "properties": {
        "latitude": {
          "type": "number",
          "format": "double"
        },
        "longitude": {
          "type": "number",
          "format": "double"
        },
        "radius": {
          "type": "number",
          "format": "double"
        }
      },
      "title": "ZipcodeDistanceRequest"
    },
    "ZipcodeDistanceResponse": {
      "type": "object",
      "properties": {
        "city": {
          "type": "string"
        },
        "distance": {
          "type": "number",
          "format": "double"
        },
        "zipcode": {
          "type": "string"
        }
      },
      "title": "ZipcodeDistanceResponse"
    },
    "ZipcodeRequest": {
      "type": "object",
      "properties": {
        "zipCode": {
          "type": "string"
        }
      },
      "title": "ZipcodeRequest"
    },
    "ZipcodeResponse": {
      "type": "object",
      "properties": {
        "city": {
          "type": "string"
        },
        "country": {
          "type": "string"
        },
        "postalCode": {
          "type": "string"
        },
        "state": {
          "type": "string"
        }
      },
      "title": "ZipcodeResponse"
    }
  }
}