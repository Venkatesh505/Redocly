{
  "swagger": "2.0",
  "info": {
    "title": "Email Validation Service",
    "description": "This service provides the functionality to validate and email identifier using StrikeIron validation.",
        "x-metadata":{
           "capability": "SYSTEM API",
           "tags":["active", "core"]
  },
    "license": {
      "name": "Apache 2.0",
      "url": "https://www.apache.org/licenses/LICENSE-2.0"
    },
    "version": "1.0"
  },
  "host": "hcp-email-validation-v1-app-p.aws-k8s.abbvienet.com",
  "basePath": "/",
  "tags": [
    {
      "name": "HCP Email Validation",
      "description": "Validation Controller"
    }
  ],
  "paths": {
    "/api/v1/validation/email/{email}": {
      "get": {
        "tags": [
          "HCP Email Validation"
        ],
        "summary": "Email Validation",
        "operationId": "emailValidationUsingGET",
        "produces": [
          "application/json"
        ],
        "parameters": [
          {
            "name": "email",
            "in": "path",
            "description": "email",
            "required": true,
            "type": "string"
          },
          {
            "name": "sourceSystem",
            "in": "header",
            "description": "sourceSystem",
            "required": true,
            "type": "string"
          },
          {
            "name": "uuid",
            "in": "query",
            "description": "uuid",
            "required": false,
            "type": "string"
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "schema": {
              "$ref": "#/definitions/ValidateEmailResponse"
            }
          },
          "400": {
            "description": "Invalid or missing parameter"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not Found"
          },
          "500": {
            "description": "Internal server error"
          }
        },
        "deprecated": false
      }
    }
  },
  "definitions": {
    "ValidateEmailResponse": {
      "type": "object",
      "properties": {
        "status": {
          "type": "string",
          "enum": [
            "SUCCESS",
            "ERROR"
          ]
        },
        "valid": {
          "type": "boolean"
        }
      },
      "title": "ValidateEmailResponse"
    }
  }
}