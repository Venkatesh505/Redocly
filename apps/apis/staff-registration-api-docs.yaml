        "operationId": "fetchAndSaveToIRep",
        "parameters": [
          {
            "name": "date",
            "in": "query",
            "description": "Date parameter in yyyy-MM-dd format (e.g., 2023-10-31)",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful",
            "content": {
