{
  "openapi": "3.0.1",
  "info": {
    "title": "Staff Registration Service",
    "description": "The Staff Registration service provides functionality for registering HCP Staff individuals",
        "x-metadata":{
           "capability": "EXPERIENCE API",
           "tags":["active", "experience"]
  },
    "license": {
      "name": "Apache 2.0",
      "url": "https://www.apache.org/licenses/LICENSE-2.0"
    },
    "version": "1.0"
  },
  "servers": [
    {
      "url": "http://staff-registration-v1-app-p.aws-k8s.abbvienet.com",
      "description": "Generated server url"
    }
  ],
  "tags": [
    {
      "name": "Staff Registration Service",
      "description": "Staff Registration Controller"
    }
  ],
  "paths": {
    "/api/v1/user/register": {
      "post": {
        "tags": [
          "Staff Registration Service"
        ],
        "summary": "API to register HCP staff details",
        "description": "Check the 'Schema' tab next to the 'Example Value' tab under the 'Request body' section. Make sure to provide all neccessary details to get the success response.",
        "operationId": "staffRegistration",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StaffRegistrationRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "500": {
            "description": "Internal Server Error - Unexcepted error occurred on the server side.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponseDto"
                },
                "example": {
                  "responseCode": "500",
                  "status": "ERROR",
                  "errors": [
                    {
                      "errorCode": "SERVER_ERROR",
                      "code": "10001",
                      "message": "An unexcepted error occurred on the server."
                    }
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized - Authentication failed or user does not have permissions for the requested operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponseDto"
                },
                "example": {
                  "responseCode": "401",
                  "status": "ERROR",
                  "errors": [
                    {
                      "errorCode": "UNAUTHORIZED",
                      "code": "10015",
                      "message": "Authentication required or failed."
                    }
                  ]
                }
              }
            }
          },
          "404": {
            "description": "Not Found - The requested resource could not be found.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponseDto"
                },
                "example": {
                  "responseCode": "404",
                  "status": "ERROR",
                  "errors": [
                    {
                      "errorCode": "NOT_FOUND",
                      "code": "10016",
                      "message": "The requested resource could not be found."
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Bad Request - Invalid or missing parameter",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponseDto"
                },
                "examples": {
                  "Empty First Name": {
                    "description": "Empty First Name",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "First name must not be empty"
                        }
                      ]
                    }
                  },
                  "Empty Last Name": {
                    "description": "Empty Last Name",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Last name must not be empty"
                        }
                      ]
                    }
                  },
                  "Empty Email": {
                    "description": "Empty Email",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Email must not be empty"
                        }
                      ]
                    }
                  },
                  "Empty Product": {
                    "description": "Empty Product",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Product name must not be empty"
                        }
                      ]
                    }
                  },
                  "Null Hcp Info": {
                    "description": "Null Hcp Info",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Hcp Info must not be null"
                        }
                      ]
                    }
                  },
                  "Null Opt Info": {
                    "description": "Null Opt Info",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Opt Info must not be null"
                        }
                      ]
                    }
                  },
                  "Empty Hcp Npi": {
                    "description": "Empty Hcp Npi",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "HCP NPI must not be empty"
                        }
                      ]
                    }
                  },
                  "Empty Hcp Acid": {
                    "description": "Empty Hcp Acid",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "HCP Acid must not be empty"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "200": {
            "description": "Staff Details saved successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StaffRegistrationResponse"
                },
                "example": {
                  "responseCode": "200",
                  "status": "SUCCESS"
                }
              }
            }
          }
        }
      }
    },
