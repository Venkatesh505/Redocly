  "components": {
    "schemas": {
      "Password": {
        "required": [
          "value"
        ],
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "description": "Value of the Password",
            "example": "Abbv@!2020"
          }
        },
        "description": "New password details of the user"
      },
      "UpdateProfileRequest": {
        "required": [
          "newPassword",
          "oldPassword",
          "userSessionId"
        ],
        "type": "object",
        "properties": {
          "userSessionId": {
            "type": "string",
            "description": "Session Id of the User for which update profile is requested",
            "example": "102B95SWMskS1CWy5deol6THg"
          },
          "oldPassword": {
            "$ref": "#/components/schemas/Password"
          },
          "newPassword": {
            "$ref": "#/components/schemas/Password"
          }
        }
      },
      "UpdateProfileResponse": {
        "type": "object",
        "properties": {
          "userSessionId": {
            "type": "string",
            "description": "Session Id",
            "example": "1023j-foP3rTh6wmj2qBZBDJw"
          }
        }
      },
      "ErrorDto": {
        "type": "object",
        "properties": {
          "errorCode": {
            "type": "string",
            "enum": [
              "SERVER_ERROR",
              "BAD_REQUEST",
              "CLIENT_ERROR",
              "INVALID_NPI",
              "INVALID_SOURCE",
              "EMAIL_CLIENT_ERROR",
              "NPI_CLIENT_ERROR",
              "OPT_IN_CLIENT_ERROR",
              "INVALID_USER_ID",
              "INVALID_SESSION",
              "INVALID_ECP_REGISTRATION_REQUEST_ALLERGEN_EYECARE",
              "NO_RECORD_FOUND",
              "INVALID_JUMPSTART_REQUEST",
              "RAR_ERROR",
              "HCP_NPI_ACID_NOT_FOUND_IN_MDM",
              "HCP_RESTRICTIONS_NO_CALL_FLAG",
              "HCP_RESTRICTIONS_DEA_REVOKED",
              "HCP_IS_NOT_IN_ABS",
              "HCP_IS_NOT_IN_APPROVED_PRODUCT",
              "REP_NOT_ALIGNED_WITH_HCP_ZIP",
              "DM_RM_NOT_WITH_TERR",
              "IREP_LOAD_ERROR",
              "TRIGGER_EMAIL_CLIENT_ERROR",
              "ONETRUST_DISABLED",
              "INVALID_EMAIL",
              "EMAIL_EXCLUSION_ERROR",
              "DUPLICATE_ACID_AND_EMAIL",
              "DATABASE_CONNECTION_ERROR",
              "LMS_DATA_ERROR",
              "INVALID_LMS_AUTH_TOKEN"
            ]
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "ErrorResponseDto": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "SUCCESS",
              "ERROR"
            ]
          },
          "errors": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ErrorDto"
            }
          }
        }
      },
      "UpdateProfileIRepRequest": {
        "required": [
          "indication",
          "individualNpi",
          "userSessionId"
        ],
        "type": "object",
        "properties": {
          "userSessionId": {
            "type": "string",
            "description": "Session Id",
            "example": "1029zIlllPrScO1sM27eblzVA"
          },
          "maxedgeUser": {
            "type": "string",
            "description": "Whether Maxedge User ?",
            "example": "in"
          },
          "ctaId": {
            "type": "string",
            "description": "Id corresponding to the campaign",
            "example": "CTA_1"
          },
          "individualNpi": {
            "type": "string",
            "description": "Individual Npi",
            "example": "1306849450"
          },
          "indication": {
            "type": "string",
            "description": "Indication Name",
            "example": "BOTOX_CM"
          },
          "modeOfContact": {
            "type": "string",
            "description": "Mode of Contact for the Rep",
            "example": "eMail"
          }
        }
      },
      "Address": {
        "type": "object",
        "properties": {
          "line1": {
            "type": "string",
            "description": "Address Line1",
            "example": "1 st lane"
          },
          "line2": {
            "type": "string",
            "description": "Address Line2",
            "example": "2nd lane"
          },
          "suite": {
            "type": "string",
            "description": "Suite Details",
            "example": "99"
          },
          "city": {
            "type": "string",
            "description": "City Name",
            "example": "Florida"
          },
          "state": {
            "type": "string",
            "description": "State Name",
            "example": "TX"
          },
          "zip": {
            "type": "string",
            "description": "Zipcode Details",
            "example": "83702"
          }
        },
        "description": "Address of the Practice Place/Organisation"
      },
      "CdMap": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "description": "Code",
            "example": "MO"
          },
          "description": {
            "type": "string",
            "description": "Description of the Code",
            "example": "Future Treatment"
          }
        },
        "description": "HCP Specialty"
      },
      "PracticeDetails": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "description": "Practice Name",
            "example": "OCD"
          },
          "placeOfService": {
            "$ref": "#/components/schemas/CdMap"
          },
          "role": {
            "$ref": "#/components/schemas/CdMap"
          },
          "locationName": {
            "type": "string",
            "description": "Location Name",
            "example": "Texas"
          },
          "organizationNpi": {
            "type": "string",
            "description": "NPI of the Organisation",
            "example": "1023011178"
