                      ]
                    }
                  },
                  "Empty Source": {
                    "description": "Empty Source",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Source must not be empty"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "200": {
            "description": "HCP Details saved successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HcpRegistrationResponse"
