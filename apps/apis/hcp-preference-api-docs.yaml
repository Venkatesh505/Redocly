            "example": "IMMUNOLOGY"
          },
          "fid": {
            "type": "string",
            "description": "HCP Fid",
            "example": "200001349686"
          },
          "npiId": {
            "type": "string",
            "description": "HCP Npi Id",
            "example": "1497722912"
          }
        }
      },
      "UpdateOptResponse": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "BAD_REQUEST",
            "enum": [
              "SUCCESS",
              "ERROR"
            ]
          }
        }
      },
      "Preferences": {
        "type": "object",
        "properties": {
          "brandName": {
            "type": "string",
            "description": "HCP Brand Name",
            "example": "Humira_1.0"
          },
          "channel": {
            "type": "string",
            "description": "HCP Channel",
            "example": "HCP"
          },
          "channelValue": {
            "type": "string",
            "description": "HCP Channel Value",
            "example": "1.0"
          },
          "communicationFrequency": {
            "type": "string",
            "description": "HCP Communication Frequency",
            "example": "20 MHZ"
          },
          "date": {
            "type": "integer",
            "description": "HCP Date",
            "format": "int64",
            "example": 1633046400
          },
          "indication": {
            "type": "string",
            "description": "HCP Indication",
            "example": "NA"
          },
          "languageId": {
            "type": "string",
            "description": "HCP Language Id",
            "example": "US001"
          },
          "languageDescription": {
            "type": "string",
            "description": "HCP Language Description",
            "example": "English"
          },
          "type": {
            "type": "string",
            "description": "HCP Type",
            "example": "Kemotherapy"
          },
          "therapeuticArea": {
            "type": "string",
            "description": "HCP Therapeutic Area",
            "example": "Neck"
          }
        },
        "description": "HCP Preferences"
      },
      "UpdateOptRequest": {
        "required": [
          "preferences",
          "source"
        ],
        "type": "object",
        "properties": {
          "hcpId": {
            "type": "string",
            "description": "HCP Hcp Id",
            "example": "5304576"
          },
          "npi": {
            "type": "string",
            "description": "HCP Npi",
            "example": "1902185168"
          },
          "email": {
            "type": "string",
            "description": "HCP Email",
            "example": "email@Mail.Com"
          },
          "source": {
            "type": "string",
            "description": "HCP Source",
            "example": "HCP"
          },
          "preferences": {
            "uniqueItems": true,
            "type": "array",
            "description": "HCP Preferences",
            "items": {
              "$ref": "#/components/schemas/Preferences"
            }
          },
          "optinText": {
            "type": "string",
            "description": "HCP Opt In Text",
            "example": "opt"
          },
          "dataLinkageId": {
            "type": "integer",
            "description": "HCP Data Linkage ID ",
            "format": "int32",
            "example": 1234
          }
        }
      },
      "OptDetails": {
        "type": "object",
        "properties": {
          "brandName": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "VRAYLAR BPD"
          },
          "subBrandName": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "VRAYLAR BPD"
          },
          "channel": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "EM"
          },
          "communicationFrequency": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "20 MHZ"
          },
          "messageType": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "NA"
          },
          "value": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "NMELTON@CEENTA.COM"
          },
          "type": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "OPTOUT"
          }
        },
        "description": "HCP Opt Details"
      },
      "OptDetailsResponse": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "description": "The textual status of the operation.",
            "example": "BAD_REQUEST",
            "enum": [
              "SUCCESS",
              "ERROR"
            ]
          },
          "optDetails": {
            "type": "array",
            "description": "HCP Opt Details",
            "items": {
              "$ref": "#/components/schemas/OptDetails"
            }
          }
        }
      }
    }
