          "exportDate",
          "hcpId"
        ],
        "type": "object",
        "properties": {
          "hcpId": {
            "type": "string",
            "description": "HCP Id",
            "example": "933644"
          },
          "type": {
            "type": "string",
            "description": "HCP Type",
            "example": "OPTOUT"
          },
          "channel": {
            "type": "string",
            "description": "HCP Channel",
            "example": "DM"
          },
          "brandName": {
            "type": "string",
            "description": "HCP Brand Name",
            "example": "HUMIRA_GASTRO"
          },
          "subBrandName": {
            "type": "string",
            "description": "HCP Sub Brand Name",
            "example": "HUMIRA"
          },
          "messageType": {
            "type": "string",
            "description": "HCP Message Type",
            "example": "NA"
          },
          "communicationFrequency": {
            "type": "string",
            "description": "HCP Communication Frequency",
            "example": "20 MHZ"
          },
          "date": {
            "type": "string",
            "description": "HCP Date",
            "example": "2017-10-13 00:00:00"
          },
          "value": {
