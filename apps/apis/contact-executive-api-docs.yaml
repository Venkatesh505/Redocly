                    "description": "Empty Npi",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "NPI must not be empty"
                        }
                      ]
                    }
                  },
                  "Empty Product Name": {
                    "description": "Empty Product Name",
                    "value": {
                      "responseCode": "400",
                      "status": "ERROR",
                      "errors": [
                        {
                          "errorCode": "BAD_REQUEST",
                          "code": "10002",
                          "message": "Product name must not be empty"
                        }
                      ]
                    }
                  },
                  "Invalid parameter": {
                    "description": "Invalid parameter",
