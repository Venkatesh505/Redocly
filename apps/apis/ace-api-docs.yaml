            "description": "The textual status of the operation.",
            "example": "BAD_REQUEST",
            "enum": [
              "SUCCESS",
              "ERROR"
            ]
          },
          "guid": {
            "type": "string",
            "description": "HCP guid",
            "example": "b6c1f2b8-5666-4aa0-ba53-920f61033080"
          },
          "result": {
            "type": "string",
            "description": "HCP result",
            "example": "b222#191987c40ee"
          },
          "requestId": {
            "type": "string",
            "description": "HCP requestId",
            "example": "b222#191987c40ee"
          }
        },
        "description": "The 'CampaignResponse' object provides detailed information about the outcome of a real time abs compliant email."
      },
      "CampaignRequest": {
        "required": [
          "acid",
          "exposureId"
        ],
        "type": "object",
        "properties": {
          "acid": {
            "type": "string",
            "description": "HCP Acid",
            "example": "5304576"
          },
          "triggerEmail": {
            "type": "string",
            "description": "HCP Trigger Email",
            "example": "lstenshoel@accessbhs.com"
          },
          "franchiseBrandIndication": {
            "type": "string",
            "description": "HCP Franchise Brand Indication",
            "example": "Humira"
          },
          "exposureId": {
            "type": "string",
            "description": "HCP Exposure Id",
            "example": "123"
          },
          "primaryValue": {
            "type": "string",
            "description": "HCP Primary Value",
            "example": "001"
          },
          "dynamicValue": {
            "type": "string",
            "description": "HCP Dynamic Value",
            "example": "001"
          }
        },
        "description": "The 'CampaignRequest' object captures essential details of an API request and response for real time abs compliant email."
