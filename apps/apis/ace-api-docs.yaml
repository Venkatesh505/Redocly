  "components": {
    "schemas": {
      "AbsValidationRequest": {
        "required": [
          "scanGroupCode"
        ],
        "type": "object",
        "properties": {
          "npi": {
            "type": "string",
            "description": "HCP Npi",
            "example": "1902185168"
          },
          "acid": {
            "type": "string",
            "description": "HCP Acid",
            "example": "5304576"
          },
          "firstName": {
            "type": "string",
            "description": "HCP First Name",
            "example": "Lindsey"
          },
          "lastName": {
            "type": "string",
            "description": "HCP Last Name",
            "example": "Stenshoel"
          },
          "address1": {
            "type": "string",
            "description": "HCP Address1",
            "example": "1276 W River St Ste 100"
          },
          "zip": {
            "type": "string",
            "description": "HCP Zip",
            "example": "83702"
          },
          "email": {
            "type": "string",
            "description": "HCP Email",
            "example": "lstenshoel@accessbhs.com"
          },
          "scanGroupCode": {
            "type": "string",
            "description": "HCP Scan Group Code",
            "example": "EXP-00098"
          }
        },
        "description": "The 'AbsValidationRequest' object captures essential details of an API request and response for real time abs compliant email."
      },
      "ErrorDto": {
