  "paths": {
    "/api/v1/user/registerMultiOptIn": {
      "post": {
        "tags": [
          "HCP Capture Service"
        ],
        "summary": "API to capture HCP Details with MultiOptIns",
        "description": "Check the 'Schema' tab next to the 'Example Value' tab under the 'Request body' section. Make sure to provide all neccessary details to get the success response.",
        "operationId": "hcpCaptureMultiOptin",
        "requestBody": {
          "content": {
