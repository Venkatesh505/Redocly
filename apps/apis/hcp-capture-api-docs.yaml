          },
          "200": {
            "description": "HCP registered Successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HcpCaptureResponse"
                },
                "example": {
                  "responseCode": "200",
                  "status": "SUCCESS"
                }
              }
            }
          }
        }
      }
    },
