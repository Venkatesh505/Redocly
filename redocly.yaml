navbar:
  items:
    - page: /
      label: Home
    - page: apps/architecture/index.page.tsx
      label: Architecture
    - page: apps/service-offerings/index.page.tsx
      label: Service Offerings
    - page: /catalog/
      label: API Catalog
    - group: Knowledge Base
      items:
        - page: /apps/resources/support-links
          label: Resources
        - page: /apps/resources/domain-models
          label: Domain Model
        - page: /apps/resources/tools-technologies
          label: Tools/Technologies
        - page: /apps/resources/use-cases
          label: Use Cases
    - group: Support
      items:
        - page: /apps/support/contact-us
          label: Contact Us

markdown:
  toc:
    depth: 2

logo:
  image: /apps/images/logo.png
  link: /

reunite:
  ignoreLint: true
  ignoreLinkChecker: true

catalogClassic:
  simple-catalog:
    slug: /catalog/
    items:
      - directory: ./
        flatten: true
        includeByMetadata:
          type: [openapi]
    filters:
      - title: Service Category
        property: capability
        missingCategoryName: Other
        type: select
      - title: API Status
        property: tags
        options: [active, core, experience, deprecated]
        type: checkboxes
    groupByFirstFilter: true
    filterValuesCasing: uppercase