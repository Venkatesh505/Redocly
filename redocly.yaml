extends:
  - minimal

links:
  - href: https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap
  - href: https://fonts.googleapis.com/css2?family=VT323&display=swap
  - href: https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap

seo:
  title: SyncX Platform
  description: The Integration Modernization project is a strategic initiative aimed at upgrading our current integration platform to enhance overall operational efficiency and agility.

# >>> Authentication & access (preferred, modern format)
